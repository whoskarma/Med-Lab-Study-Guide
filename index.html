<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Lab Study Guide</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>

    <h1>🩺 Medical Lab Study Guide</h1>

    <p>Interactive Study Guide • Chapters 3 & 4</p>

    <button id="themeBtn">🌙 Dark Mode</button>

</header>

<nav>

    <button class="nav active" data-page="home">Home</button>

    <button class="nav" data-page="chapter3">Chapter 3</button>

    <button class="nav" data-page="chapter4">Chapter 4</button>

    <button class="nav" data-page="flashcards">Flashcards</button>

    <button class="nav" data-page="quiz">Quiz</button>

</nav>

<main>

<section id="home" class="page active">

<h2>Welcome!</h2>

<p>
Use the navigation above to review notes,
practice flashcards, and take quizzes.
</p>

<div class="progress">

<div id="progressBar"></div>

</div>

<p id="progressText">0% Complete</p>

</section>

<section id="chapter3" class="page">

<h2>Chapter 3 Notes</h2>

<div id="chapter3Notes"></div>

</section>

<section id="chapter4" class="page">

<h2>Chapter 4 Notes</h2>

<div id="chapter4Notes"></div>

</section>

<section id="flashcards" class="page">

<h2>Flashcards</h2>

<div class="flashcard">

<div class="card" id="flashCard">

<div class="front" id="cardFront">

Question

</div>

<div class="back" id="cardBack">

Answer

</div>

</div>

</div>

<div class="controls">

<button id="prevCard">

⬅ Previous

</button>

<button id="flipCard">

🔄 Flip

</button>

<button id="nextCard">

Next ➡

</button>

</div>

</section>

<section id="quiz" class="page">

<h2>Quiz</h2>

<div id="question"></div>

<div id="answers"></div>

<button id="nextQuestion">

Next Question

</button>

<h3 id="score">

Score: 0

</h3>

</section>

</main>

<footer>

<p>

Medical Laboratory Study Guide

</p>

</footer>

<script src="script.js"></script>

</body>

</html>
